name: Practice 5 API contracts

on:
  push:
    paths:
    - 'services/**'
    - 'docker-compose.yaml'
    - '.env.example'
    - 'scripts/api-tests.sh'
    - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
    - 'services/**'
    - 'docker-compose.yaml'
    - '.env.example'
    - 'scripts/api-tests.sh'
    - '.github/workflows/api-tests.yml'
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Run API contract tests
      run: bash scripts/api-tests.sh
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results
        path: services/api-tests/target/surefire-reports/
